<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrador | Perfumes Cam</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101010;color:#fff;font-family:Arial,sans-serif}
.container{max-width:900px;margin:auto}
h1{color:#d8b45b;text-align:center}
h2{color:#d8b45b}
.panel{background:#1c1c1c;padding:20px;border-radius:12px;margin:18px 0}
input,select{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #555;border-radius:7px;background:#292929;color:white;font-size:16px}
button{border:0;border-radius:7px;padding:12px 16px;font-size:15px;font-weight:bold;cursor:pointer;margin:4px}
.primary{background:#d8b45b;color:#111}
.secondary{background:#444;color:white}
.danger{background:#a83232;color:white}
button:disabled{opacity:.5;cursor:not-allowed}
.product{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #444;flex-wrap:wrap}
.product img{width:65px;height:65px;object-fit:contain;background:#292929;border-radius:8px}
.details{flex:1;min-width:130px}
.details strong{display:block;margin-bottom:5px}
.muted{color:#aaa;font-size:13px}
#message{padding:10px;color:#e5c875;white-space:pre-wrap}
.hidden{display:none}
label{display:block;color:#ddd;margin-top:8px}
@media(max-width:500px){body{padding:12px}.panel{padding:14px}}
</style>
</head>
<body>
<div class="container">
<h1>PERFUMES CAM</h1>
<p style="text-align:center;color:#aaa">Panel de administración</p>

<div id="loginPanel" class="panel">
<h2>Iniciar sesión</h2>
<form id="loginForm">
<label>Correo electrónico</label>
<input id="email" type="email" required autocomplete="username">
<label>Contraseña</label>
<input id="password" type="password" required autocomplete="current-password">
<button class="primary" id="loginButton" type="submit">Entrar</button>
</form>
</div>

<div id="adminPanel" class="hidden">
<div style="text-align:right">
<button class="secondary" id="logoutButton">Cerrar sesión</button>
</div>

<div class="panel">
<h2 id="formTitle">Agregar producto</h2>
<form id="productForm">
<input type="hidden" id="productId">

<label>Nombre del producto</label>
<input id="name" type="text" required placeholder="Ej. Odyssey Mega">

<label>Marca</label>
<input id="brand" type="text" placeholder="Ej. Armaf">

<label>Categoría</label>
<select id="category">
<option value="Perfumes">Perfumes</option>
<option value="Decants">Decants</option>
<option value="Otros">Otros</option>
</select>

<label>Precio</label>
<input id="price" type="number" min="0" step="0.01" placeholder="Ej. 900">

<label>Fotografía del producto</label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/*">
<p class="muted" id="photoHelp">Si no seleccionas una fotografía, se conservará la actual al editar.</p>

<button class="primary" id="saveButton" type="submit">Guardar producto</button>
<button class="secondary" id="cancelButton" type="button">Cancelar</button>
</form>
<div id="message"></div>
</div>

<div class="panel">
<h2>Productos registrados</h2>
<input id="search" type="search" placeholder="Buscar producto...">
<p id="productCount" class="muted"></p>
<div id="productList"></div>
</div>
</div>
</div>

<script>
"use strict";

const SUPABASE_URL="https://aymqmhgsxbckhutrtpvw.supabase.co";
const KEY_NAME="supabase_publishable_key";

let SUPABASE_KEY=localStorage.getItem(KEY_NAME);

if(!SUPABASE_KEY){
  SUPABASE_KEY=prompt("Pega tu clave pública de Supabase (sb_publishable_)");
  if(SUPABASE_KEY && SUPABASE_KEY.trim()){
    SUPABASE_KEY=SUPABASE_KEY.trim();
    localStorage.setItem(KEY_NAME,SUPABASE_KEY);
  }
}

const BUCKET_NAME="productos";
const $=id=>document.getElementById(id);
let db=null;
let products=[];

function message(text){
  $("message").textContent=text;
}

function formatPrice(price){
  if(price===null || price===undefined || price===""){
    return "Precio por consultar";
  }
  return "$"+Number(price).toLocaleString("es-MX",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function showAdmin(){
  $("loginPanel").classList.add("hidden");
  $("adminPanel").classList.remove("hidden");
}

function showLogin(){
  $("adminPanel").classList.add("hidden");
  $("loginPanel").classList.remove("hidden");
}

async function login(event){
  event.preventDefault();

  if(!db){
    alert("No hay conexión con Supabase.");
    return;
  }

  $("loginButton").disabled=true;
  $("loginButton").textContent="Ingresando...";

  try{
    const {error}=await db.auth.signInWithPassword({
      email:$("email").value.trim(),
      password:$("password").value
    });

    if(error) throw error;

    $("password").value="";
    showAdmin();
    await loadProducts();

  }catch(error){
    alert("Error al iniciar sesión: "+error.message);
  }finally{
    $("loginButton").disabled=false;
    $("loginButton").textContent="Entrar";
  }
}

async function logout(){
  await db.auth.signOut();
  products=[];
  $("productList").replaceChildren();
  showLogin();
}

async function checkSession(){
  if(!db)return;

  const {data,error}=await db.auth.getSession();

  if(error){
    message(error.message);
    return;
  }

  if(data.session){
    showAdmin();
    await loadProducts();
  }else{
    showLogin();
  }
}

async function loadProducts(){
  message("Cargando productos...");

  try{
    const {data,error}=await db
      .from("products")
      .select("*")
      .order("id",{ascending:true});

    if(error)throw error;

    products=data||[];
    renderProducts();
    message("");

  }catch(error){
    message("Error al cargar productos: "+error.message);
  }
}

function renderProducts(){
  const list=$("productList");
  list.replaceChildren();

  const term=$("search").value.trim().toLowerCase();

  const filtered=products.filter(p=>
    String(p.name||"").toLowerCase().includes(term)||
    String(p.brand||"").toLowerCase().includes(term)
  );

  $("productCount").textContent=filtered.length+" productos encontrados";

  filtered.forEach(p=>{
    const item=document.createElement("div");
    item.className="product";

    const img=document.createElement("img");
    img.alt=p.name||"Producto";

    if(p.image_path){
      const {data}=db.storage.from(BUCKET_NAME).getPublicUrl(p.image_path);
      img.src=data.publicUrl;
    }

    const details=document.createElement("div");
    details.className="details";

    const name=document.createElement("strong");
    name.textContent=p.name;

    const info=document.createElement("span");
    info.className="muted";
    info.textContent=(p.brand||"Sin marca")+" · "+
      (p.category||"Sin categoría")+" · "+formatPrice(p.price);

    details.append(name,info);

    const edit=document.createElement("button");
    edit.className="primary";
    edit.textContent="Editar";
    edit.addEventListener("click",()=>editProduct(p.id));

    const del=document.createElement("button");
    del.className="danger";
    del.textContent="Borrar";
    del.addEventListener("click",()=>deleteProduct(p.id));

    item.append(img,details,edit,del);
    list.append(item);
  });
}

function editProduct(id){
  const p=products.find(x=>Number(x.id)===Number(id));

  if(!p){
    message("No se encontró el producto.");
    return;
  }

  $("productId").value=p.id;
  $("name").value=p.name||"";
  $("brand").value=p.brand||"";
  $("category").value=p.category||"Perfumes";
  $("price").value=p.price??"";
  $("photo").value="";

  $("formTitle").textContent="Editar producto";
  $("saveButton").textContent="Actualizar producto";
  $("photoHelp").textContent=p.image_path?
    "Tiene una fotografía. Selecciona otra si deseas cambiarla.":
    "Este producto todavía no tiene fotografía.";

  $("productForm").scrollIntoView({behavior:"smooth"});
  message("Editando: "+p.name);
}

function resetForm(){
  $("productForm").reset();
  $("productId").value="";
  $("formTitle").textContent="Agregar producto";
  $("saveButton").textContent="Guardar producto";
  $("photoHelp").textContent="Si no seleccionas una fotografía, se conservará la actual al editar.";
}

async function saveProduct(event){
  const {data:{user},error}=await db.auth.getUser();

message(
  error
    ? "Error de sesión: "+error.message
    : "Usuario conectado: "+user.id
);

console.log("Usuario Supabase:",user);
  event.preventDefault();

  const id=$("productId").value;
  const name=$("name").value.trim();
  const brand=$("brand").value.trim();
  const category=$("category").value;
  const rawPrice=$("price").value.trim();
  const price=rawPrice===""?null:Number(rawPrice);
  const file=$("photo").files[0];

  if(!name){
    message("Escribe el nombre del producto.");
    return;
  }

  if(price!==null&&(!Number.isFinite(price)||price<0)){
    message("El precio no es válido.");
    return;
  }

  $("saveButton").disabled=true;
  message(file?"Fotografía detectada: "+file.name+"\nSubiendo fotografía...":"Guardando producto...");

  try{
    const existing=id?
      products.find(p=>Number(p.id)===Number(id)):null;

    if(id&&!existing){
      throw new Error("No se encontró el producto.");
    }

    let image_path=existing?.image_path||null;

    if(file){
      if(!file.type.startsWith("image/")){
        throw new Error("Selecciona un archivo de imagen válido.");
      }

      const extension=file.name.split(".").pop().toLowerCase();
      const path=Date.now()+"-"+
        Math.random().toString(36).slice(2)+"."+extension;

      const {error:uploadError}=await db.storage
        .from(BUCKET_NAME)
        .upload(path,file,{
          contentType:file.type,
          upsert:false
        });

      if(uploadError)throw uploadError;

      image_path=path;
    }

    const record={
      name,
      brand,
      category,
      price,
      image_path,
      active:true
    };

    let result;

    if(id){
      result=await db.from("products")
        .update(record)
        .eq("id",Number(id))
        .select()
        .single();
    }else{
      result=await db.from("products")
        .insert(record)
        .select()
        .single();
    }

    if(result.error)throw result.error;

    resetForm();
    await loadProducts();
    message("¡Producto guardado correctamente!");

  }catch(error){
    message("Error al guardar: "+error.message);
  }finally{
    $("saveButton").disabled=false;
  }
}

async function deleteProduct(id){
  const p=products.find(x=>Number(x.id)===Number(id));
  if(!p)return;

  if(!confirm("¿Seguro que deseas borrar "+p.name+"?"))return;

  try{
    message("Eliminando producto...");

    const {error}=await db.from("products")
      .delete()
      .eq("id",Number(id));

    if(error)throw error;

    if(p.image_path){
      const {error:photoError}=await db.storage
        .from(BUCKET_NAME)
        .remove([p.image_path]);

      if(photoError){
        message("Producto eliminado, pero no se pudo borrar su fotografía: "+photoError.message);
        await loadProducts();
        return;
      }
    }

    await loadProducts();
    message("Producto eliminado correctamente.");

  }catch(error){
    message("Error al borrar: "+error.message);
  }
}

$("loginForm").addEventListener("submit",login);
$("productForm").addEventListener("submit",saveProduct);
$("logoutButton").addEventListener("click",logout);
$("cancelButton").addEventListener("click",()=>{
  resetForm();
  message("");
});
$("search").addEventListener("input",renderProducts);

if(SUPABASE_KEY&&window.supabase){
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  checkSession();
}else{
  message("No se encontró la clave pública de Supabase.");
}
</script>
</body>
</html>
