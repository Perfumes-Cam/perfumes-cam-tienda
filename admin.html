
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrador | Perfumes Cam</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#101010;color:#fff;font-family:Arial,sans-serif}
main{max-width:750px;margin:auto}
h1,h2{color:#d6b56d}
.card{background:#1c1c1c;padding:18px;border-radius:12px;margin:16px 0}
input,select,button{width:100%;padding:13px;margin:7px 0;border-radius:7px;border:1px solid #555;font-size:16px}
input,select{background:#292929;color:white}
button{background:#d6b56d;color:#111;border:0;font-weight:bold;cursor:pointer}
.secondary{background:#444;color:white}
.danger{background:#9e3030;color:white}
.hidden{display:none!important}
#message{color:#e8c879;white-space:pre-wrap;overflow-wrap:anywhere}
.product{display:flex;gap:10px;align-items:center;border-bottom:1px solid #444;padding:12px 0}
.product img,.no-photo{width:65px;height:65px;object-fit:cover;border-radius:7px;flex-shrink:0}
.no-photo{background:#333;display:grid;place-items:center;font-size:11px;text-align:center}
.product-info{flex:1;min-width:0}
.product-info strong{display:block;overflow-wrap:anywhere}
.product-info small{color:#bbb}
.actions{display:flex;flex-direction:column;gap:4px;width:76px}
.actions button{padding:8px 4px;margin:2px 0;font-size:12px}
.top{display:flex;align-items:center;gap:10px}
.top h2{flex:1}
.top button{width:auto}
</style>
</head>

<body>
<main>
<h1>Perfumes Cam</h1>
<p>Panel de administración</p>

<section id="login" class="card">
<h2>Iniciar sesión</h2>
<input id="email" type="email" placeholder="Correo del administrador">
<input id="password" type="password" placeholder="Contraseña">
<button id="loginButton" type="button">Entrar</button>
</section>

<section id="panel" class="hidden">

<div class="card">
<div class="top">
<h2>Administrar productos</h2>
<button id="logoutButton" type="button" class="secondary">Salir</button>
</div>

<form id="productForm">
<input id="productId" type="hidden">

<label>Nombre del producto</label>
<input id="name" required placeholder="Ej. Odyssey Mega">

<label>Marca</label>
<input id="brand" placeholder="Ej. ARMAF">

<label>Categoría</label>
<select id="category">
<option value="Perfumes">Perfumes</option>
<option value="Decants">Decants</option>
<option value="Otros">Otros</option>
</select>

<label>Precio en pesos</label>
<input id="price" type="number" min="0" step="0.01" placeholder="Vacío = Precio por consultar">

<label>Fotografía</label>
<input id="photo" type="file" accept="image/*">

<button id="saveButton" type="submit">Guardar producto</button>
<button type="button" id="clearButton" class="secondary">Limpiar formulario</button>
</form>
</div>

<div class="card">
<h2>Catálogo de productos</h2>
<input id="search" placeholder="Buscar producto..." >
<div id="products"></div>
</div>

</section>

<p id="message"></p>
</main>

<script>
const SUPABASE_URL = "https://aymqmhgsxbckhutrtpvw.supabase.co";

let SUPABASE_KEY = localStorage.getItem("supabase_publishable_key");

if(!SUPABASE_KEY){
  SUPABASE_KEY = window.prompt("Pega tu clave pública de Supabase (sb_publishable_)");
  if(SUPABASE_KEY && SUPABASE_KEY.trim()){
    SUPABASE_KEY = SUPABASE_KEY.trim();
    localStorage.setItem("supabase_publishable_key",SUPABASE_KEY);
  }else{
    SUPABASE_KEY = null;
  }
}

let db = null;
let products = [];

const $ = id => document.getElementById(id);

function message(text){
  $("message").textContent = text;
}

if(window.supabase && SUPABASE_KEY){
  db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
}else if(!window.supabase){
  message("No se pudo cargar Supabase. Revisa tu conexión a internet.");
}else{
  message("Falta la clave pública. Recarga la página para ingresarla.");
}

async function login(){
  if(!db){
    message("No hay conexión configurada con Supabase. Recarga la página.");
    return;
  }

  const email = $("email").value.trim();
  const password = $("password").value;

  if(!email || !password){
    message("Escribe tu correo y contraseña.");
    return;
  }

  $("loginButton").disabled = true;
  message("Verificando acceso...");

  try{
    const {error} = await db.auth.signInWithPassword({email,password});

    if(error){
      message("No se pudo iniciar sesión: "+error.message);
      return;
    }

    await checkSession();
  }catch(error){
    message("Error de conexión: "+error.message);
  }finally{
    $("loginButton").disabled = false;
  }
}

async function logout(){
  const {error} = await db.auth.signOut();

  if(error){
    message("Error al cerrar sesión: "+error.message);
    return;
  }

  $("panel").classList.add("hidden");
  $("login").classList.remove("hidden");
  message("Sesión cerrada.");
}

async function checkSession(){
  const {data,error} = await db.auth.getSession();

  if(error){
    message("Error de sesión: "+error.message);
    return;
  }

  if(!data.session){
    $("login").classList.remove("hidden");
    $("panel").classList.add("hidden");
    return;
  }

  $("login").classList.add("hidden");
  $("panel").classList.remove("hidden");

  await loadProducts();
}

async function loadProducts(){
  message("Cargando productos...");

  const {data,error} = await db
    .from("products")
    .select("*")
    .order("id",{ascending:true});

  if(error){
    message("Error al cargar productos: "+error.message);
    return;
  }

  products = data || [];
  renderProducts();
  message("Productos encontrados: "+products.length);
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function renderProducts(){
  const search = $("search").value.toLowerCase();

  const list = products.filter(p =>
    (p.name || "").toLowerCase().includes(search) ||
    (p.brand || "").toLowerCase().includes(search)
  );

  $("products").innerHTML = list.map(p=>{
    const photo = p.image_path
      ? db.storage.from("productos").getPublicUrl(p.image_path).data.publicUrl
      : "";

    const imageHTML = photo
      ? `<img src="${escapeHTML(photo)}" alt="Fotografía del producto">`
      : `<div class="no-photo">Sin foto</div>`;

    const priceText = p.price == null
      ? "Precio por consultar"
      : "$"+Number(p.price).toLocaleString("es-MX")+" MXN";

    return `
      <div class="product">
        ${imageHTML}
        <div class="product-info">
          <strong>${escapeHTML(p.name)}</strong>
          <small>${escapeHTML(p.brand)} · ${escapeHTML(p.category)}</small>
          <br><small>${priceText}</small>
        </div>
        <div class="actions">
          <button type="button" onclick="editProduct(${p.id})">Editar</button>
          <button type="button" class="danger" onclick="deleteProduct(${p.id})">Borrar</button>
        </div>
      </div>`;
  }).join("") || "<p>No se encontraron productos.</p>";
}

function editProduct(id){
  const p = products.find(x=>x.id===id);
  if(!p)return;

  $("productId").value = p.id;
  $("name").value = p.name;
  $("brand").value = p.brand || "";
  $("category").value = p.category;
  $("price").value = p.price ?? "";
  $("photo").value = "";

  $("saveButton").textContent = "Actualizar producto";
  window.scrollTo({top:0,behavior:"smooth"});
  message("Editando: "+p.name);
}

function resetForm(){
  $("productForm").reset();
  $("productId").value = "";
  $("saveButton").textContent = "Guardar producto";
  message("");
}

async function saveProduct(event){
  event.preventDefault();

  const id = $("productId").value;
  const name = $("name").value.trim();
  const brand = $("brand").value.trim();
  const category = $("category").value;
  const rawPrice = $("price").value;
  const price = rawPrice === "" ? null : Number(rawPrice);
  const file = $("photo").files[0];

  if(!name){
    message("Escribe el nombre del producto.");
    return;
  }

  if(price !== null && (!Number.isFinite(price) || price < 0)){
    message("El precio no es válido.");
    return;
  }

  $("saveButton").disabled = true;
  message("Guardando producto...");

  try{
    const existing = id
      ? products.find(p=>p.id===Number(id))
      : null;

    if(id && !existing){
      message("No se encontró el producto que quieres editar.");
      return;
    }

    let image_path = existing?.image_path || null;

    if(file){
      if(!file.type.startsWith("image/")){
        message("Selecciona un archivo de imagen.");
        return;
      }

      const extension = file.name.split(".").pop().toLowerCase();
      const path = Date.now()+"-"+Math.random().toString(36).slice(2)+"."+extension;

      const {error:uploadError} = await db.storage
        .from("productos")
        .upload(path,file,{contentType:file.type});

      if(uploadError){
        message("Error al subir fotografía: "+uploadError.message);
        return;
      }

      image_path = path;
    }

    const record = {
      name,
      brand,
      category,
      price,
      image_path,
      active:true
    };

    let result;

    if(id){
      result = await db.from("products")
        .update(record)
        .eq("id",Number(id));
    }else{
      result = await db.from("products").insert(record);
    }

    if(result.error){
      message("Error al guardar: "+result.error.message);
      return;
    }

    resetForm();
    await loadProducts();
    message("Producto guardado correctamente.");

  }catch(error){
    message("Error: "+error.message);
  }finally{
    $("saveButton").disabled = false;
  }
}

async function deleteProduct(id){
  const p = products.find(x=>x.id===id);
  if(!p)return;

  if(!confirm("¿Seguro que deseas eliminar "+p.name+"?"))return;

  message("Eliminando producto...");

  const {error} = await db.from("products").delete().eq("id",id);

  if(error){
    message("Error al eliminar: "+error.message);
    return;
  }

  if(p.image_path){
    const {error:photoError} = await db.storage
      .from("productos")
      .remove([p.image_path]);

    if(photoError){
      message("Producto eliminado, pero no se pudo borrar su fotografía: "+photoError.message);
      await loadProducts();
      return;
    }
  }

  await loadProducts();
  message("Producto eliminado correctamente.");
}

$("loginButton").addEventListener("click",login);
$("logoutButton").addEventListener("click",logout);
$("productForm").addEventListener("submit",saveProduct);
$("clearButton").addEventListener("click",resetForm);
$("search").addEventListener("input",renderProducts);

checkSession();
</script>
</body>
</html>
